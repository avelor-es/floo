     C400,250 403,263 409,284 C420,316 415,354 412,385 Z"
  fill="#00CC44" opacity="0.92"/>

<!-- Bright tip -->
<path class="flame-tip"
  d="M396,236 C398,216 400,202 400,193
     C400,202 402,216 404,236
     C402,228 400,218 400,212
     C400,218 398,228 396,236 Z"
  fill="#AAFFAA" opacity="0.88"/>

<!-- Floating sparks -->
<circle class="spark" cx="368" cy="306" r="2.2" fill="#88FF88" opacity="0.82" style="animation-delay: 0s"/>
<circle class="spark" cx="432" cy="295" r="1.8" fill="#88FF88" opacity="0.75" style="animation-delay: -0.7s"/>
<circle class="spark" cx="386" cy="262" r="1.8" fill="#CCFFCC" opacity="0.85" style="animation-delay: -1.4s"/>
<circle class="spark" cx="416" cy="268" r="2.2" fill="#88FF88" opacity="0.72" style="animation-delay: -2.1s"/>
<circle class="spark" cx="352" cy="342" r="1.5" fill="#55DD55" opacity="0.65" style="animation-delay: -0.4s"/>
<circle class="spark" cx="450" cy="330" r="1.5" fill="#55DD55" opacity="0.65" style="animation-delay: -1.1s"/>
<circle class="spark" cx="400" cy="230" r="1.5" fill="#DDFFD0" opacity="0.75" style="animation-delay: -2.5s"/>
<circle class="spark" cx="375" cy="240" r="1.2" fill="#AAFFAA" opacity="0.6"  style="animation-delay: -1.8s"/>
<circle class="spark" cx="425" cy="245" r="1.2" fill="#AAFFAA" opacity="0.6"  style="animation-delay: -0.9s"/>

<!-- HEARTH LEDGE -->
<rect x="190" y="386" width="420" height="18" fill="#9A8868" stroke="#1C0F0A" stroke-width="1.3"/>
<line x1="194" y1="395" x2="606" y2="395" stroke="#1C0F0A" stroke-width="0.5" opacity="0.4"/>

<!-- ─── FOOTER ─── -->

<!-- Rule above tagline -->
<line x1="115" y1="430" x2="680" y2="430" stroke="#1C0F0A" stroke-width="0.8"/>
<circle cx="400" cy="430" r="2.5"          fill="#1C0F0A"/>
<circle cx="210" cy="430" r="1.5"          fill="#1C0F0A" opacity="0.65"/>
<circle cx="590" cy="430" r="1.5"          fill="#1C0F0A" opacity="0.65"/>

<!-- Tagline -->
<text x="400" y="452"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="13.5"
  font-style="italic"
  fill="#4A3520"
  text-anchor="middle">"Throw the powder, speak the name — and you shall arrive."</text>

<!-- Attribution -->
<text x="400" y="470"
  font-family="Georgia, 'Times New Roman', serif"
